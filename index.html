<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PinkEnglish – English Learning DNA</title>
<style>
:root{--p:#ff5fa2;--p2:#ff9ec7;--p3:#ffd3e6;--ink:#4a2338;--mut:#9a6a82;--ok:#2fbf8a;--no:#f2557a}
*{box-sizing:border-box}
body{margin:0;font-family:"Quicksand","Nunito","Segoe UI",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#fff3f8,#ffe2ef 55%,#ffd3e6);min-height:100vh}
header{text-align:center;padding:22px 16px}
main{max-width:980px;margin:0 auto;padding:0 14px 40px}
.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 8px 22px rgba(255,95,162,.12)}
.btn{border:0;background:var(--p);color:#fff;padding:10px 16px;border-radius:999px;cursor:pointer;font:inherit;font-weight:700}
.btn.alt{background:#fff;color:var(--p);border:1px solid #ffd3e6}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #ffe0ee}
.note{font-size:13px;color:var(--mut)}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#fff0f6;color:var(--p);font-weight:700}
input,select,textarea{width:100%;padding:10px 12px;border:2px solid var(--p3);border-radius:12px;font:inherit;margin:6px 0}
</style>
</head>
<body>
<header>
  <h1>🌸 PinkEnglish</h1>
  <p class="note">Dữ liệu chính lưu trên server / SQLite, không dùng localStorage làm nguồn dữ liệu chính</p>
</header>
<main id="app"></main>

<script>
const $ = s => document.querySelector(s);
const api = async (path, opts = {}) => {
  const res = await fetch(path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts));
  if (!res.ok) {
    let err = await res.text().catch(() => '');
    try { err = JSON.parse(err).error || err; } catch (e) {}
    throw new Error(err || res.statusText);
  }
  return res.json();
};

let USER_ID = Number(localStorage.getItem('pe_user') || 0) || null;
let CONTENT = { words: [], questions: [], scenarios: [] };
let STATE = { stat: {}, days: [], log: {}, xp: 0, sn: {}, wrong: {}, tg: {}, notes: [] };

async function ensureUser() {
  if (!USER_ID) {
    const u = await api('/api/users', { method: 'POST', body: JSON.stringify({ name: 'Bạn' }) });
    USER_ID = u.id;
    localStorage.setItem('pe_user', String(USER_ID));
  }
}

async function loadAll() {
  try {
    await ensureUser();
    const [content, state, notes] = await Promise.all([
      api('/api/content'),
      api('/api/state?user_id=' + USER_ID),
      api('/api/notes?user_id=' + USER_ID)
    ]);
    CONTENT = content;
    STATE = state;
    STATE.notes = notes.rows || [];
    renderHome();
  } catch (e) {
    console.error(e);
    const app = document.getElementById('app');
    app.innerHTML = `<div class=\"card\"><h3>Lỗi kết nối</h3><p>${e.message}</p></div>`;
  }
}

function renderHome() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="card">
      <h2>Xin chào</h2>
      <p class="note">Bạn đang dùng tài khoản #${USER_ID}</p>
      <div class="row">
        <div><span class="badge">XP</span> <b>${STATE.xp || 0}</b></div>
        <div><button class="btn" id="refresh">Tải lại</button></div>
      </div>
    </div>

    <div class="card">
      <h3>📈 Trạng thái</h3>
      <div class="note">Tổng XP: <b>${STATE.xp || 0}</b></div>
      <div style="margin-top:12px">
        <button class="btn" id="practice">Ôn luyện 20 câu</button>
        <button class="btn alt" id="daily">Daily</button>
        <button class="btn alt" id="notes">Sổ tay</button>
      </div>
    </div>

    <div class="card">
      <h3>Ví dụ từ vựng</h3>
      <div id="sample"></div>
    </div>
  `;

  $('#refresh').onclick = loadAll;
  $('#practice').onclick = startPractice;
  $('#daily').onclick = startDaily;
  $('#notes').onclick = showNotes;

  const sample = $('#sample');
  sample.innerHTML = (CONTENT.words || []).slice(0, 8).map(w => `
    <div class="row">
      <div>${w.en} — ${w.vi}</div>
      <div class="note">Lv ${w.lv}</div>
    </div>
  `).join('');
}

async function startPractice() {
  const BANK = (CONTENT.questions || []).map(q => ({
    id: q.id,
    lv: q.level,
    sk: q.skill,
    tag: q.topic,
    q: q.prompt,
    o: (q.options || []).map(x => x.text),
    a: (q.options || []).findIndex(x => x.is_correct),
    tgt: q.target,
    say: q.audio
  }));

  if (!BANK.length) {
    alert('Chưa có câu hỏi trong CSDL.');
    return;
  }

  const shuffled = BANK.sort(() => Math.random() - 0.5).slice(0, 20);

  let attempt = null;
  try {
    attempt = await api('/api/attempts', {
      method: 'POST',
      body: JSON.stringify({ user_id: USER_ID, tab: 'practice', title: 'Ôn 20 câu', score: 0, total: shuffled.length })
    });
  } catch (e) {
    console.warn('Attempt create failed', e);
  }

  let idx = 0, score = 0;
  const app = document.getElementById('app');

  const showQuestion = () => {
    const q = shuffled[idx];
    app.innerHTML = `
      <div class="card">
        <h3>Câu ${idx + 1}/${shuffled.length}</h3>
        <div>${q.q}</div>
        <div style="margin-top:12px">
          ${q.o.map((t, i) => `<button class="btn alt" data-i="${i}" style="display:block;width:100%;margin:8px 0">${t}</button>`).join('')}
        </div>
        <div id="fb" style="margin-top:8px"></div>
      </div>
    `;

    document.querySelectorAll('[data-i]').forEach(btn => {
      btn.onclick = async () => {
        const sel = Number(btn.dataset.i);
        const ok = sel === q.a;
        if (ok) score += 1;

        try {
          await api('/api/answers', {
            method: 'POST',
            body: JSON.stringify({
              user_id: USER_ID,
              attempt_id: attempt && attempt.id,
              question_id: q.id,
              skill: q.sk,
              tab: 'practice',
              score: ok ? 1 : 0
            })
          });
        } catch (e) {
          console.warn('save answer failed', e);
        }

        $('#fb').innerHTML = `<div class="note">${ok ? '✅ Đúng' : '❌ Sai — đáp án: ' + q.o[q.a]}</div>
          <div style="margin-top:10px"><button class="btn" id="next">Tiếp</button></div>`;

        $('#next').onclick = () => {
          idx += 1;
          if (idx < shuffled.length) showQuestion();
          else finishPractice();
        };
      };
    });
  };

  const finishPractice = async () => {
    try {
      if (attempt && attempt.id) {
        await api('/api/attempts/' + attempt.id, { method: 'PUT', body: JSON.stringify({ score, total: shuffled.length }) });
      }
    } catch (e) {
      console.warn('update attempt failed', e);
    }

    try {
      await api('/api/days', {
        method: 'POST',
        body: JSON.stringify({ user_id: USER_ID, day: new Date().toISOString().slice(0, 10), xp: Math.round(score * 2) })
      });
    } catch (e) {
      console.warn('mark day failed', e);
    }

    alert('Kết thúc: ' + score + '/' + shuffled.length);
    loadAll();
  };

  showQuestion();
}

async function startDaily() {
  try {
    await api('/api/days', {
      method: 'POST',
      body: JSON.stringify({ user_id: USER_ID, day: new Date().toISOString().slice(0, 10), xp: 50 })
    });
    alert('Daily đã lưu 50 XP');
    loadAll();
  } catch (e) {
    alert('Daily lỗi: ' + e.message);
  }
}

function showNotes() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="card">
      <h3>Sổ tay</h3>
      <div style="margin-top:8px">
        <select id="nt">
          <option>Từ vựng</option>
          <option>Mẫu câu</option>
          <option>Câu hay</option>
          <option>Lỗi</option>
        </select>
      </div>
      <input id="noteText" placeholder="Nội dung..." />
      <div style="margin-top:8px">
        <button class="btn" id="addNote">Thêm</button>
        <button class="btn alt" id="backHome">Quay lại</button>
      </div>
      <div id="notesList" style="margin-top:12px"></div>
    </div>
  `;

  $('#addNote').onclick = async () => {
    const type = $('#nt').value;
    const content = $('#noteText').value.trim();
    if (!content) return alert('Nhập nội dung');
    try {
      const row = await api('/api/notes', {
        method: 'POST',
        body: JSON.stringify({ user_id: USER_ID, type, content, dedupe: true })
      });
      alert('Đã thêm ghi chú');
      loadAll();
    } catch (e) {
      alert('Lỗi: ' + e.message);
    }
  };

  $('#backHome').onclick = loadAll;

  const rows = STATE.notes || [];
  const list = $('#notesList');
  list.innerHTML = rows.map(n => `
    <div class="row">
      <div>
        <div><b>${n.type}</b></div>
        <div class="note">${n.content}</div>
      </div>
      <div>
        <button class="btn alt" data-id="${n.id}">Sửa</button>
        <button class="btn" data-id="${n.id}">Xóa</button>
      </div>
    </div>
  `).join('');

  list.querySelectorAll('[data-id]').forEach(btn => {
    const id = btn.dataset.id;
    const action = btn.textContent.trim();
    if (action === 'Xóa') {
      btn.onclick = async () => {
        try {
          await fetch('/api/notes/' + id, { method: 'DELETE' });
          alert('Đã xóa');
          loadAll();
        } catch (e) {
          alert('Lỗi: ' + e.message);
        }
      };
    } else {
      btn.onclick = async () => {
        const note = (STATE.notes || []).find(x => String(x.id) === String(id));
        const txt = prompt('Sửa nội dung', note.content);
        if (!txt) return;
        try {
          await api('/api/notes/' + id, { method: 'PUT', body: JSON.stringify({ content: txt }) });
          alert('Đã sửa');
          loadAll();
        } catch (e) {
          alert('Lỗi: ' + e.message);
        }
      };
    }
  });
}

loadAll();
</script>
</body>
</html>
